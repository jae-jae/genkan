# Categories for the notes generated by `gh release create --generate-notes`.
# A PR lands in the first category whose labels it carries.
changelog:
  exclude:
    labels:
      - release:skip
  categories:
    - title: Breaking changes
      labels:
        - release:major
        - breaking
    - title: Features
      labels:
        - feature
        - enhancement
        - release:minor
    - title: Fixes
      labels:
        - bug
        - fix
    - title: Dependencies
      labels:
        - dependencies
    - title: Other changes
      labels:
        - "*"
